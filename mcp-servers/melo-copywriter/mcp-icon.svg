<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Main gradient for the connection hub -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>

    <!-- Gradient for outer ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4B5FD"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>

    <!-- Gradient for connection nodes -->
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>

    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Connection lines -->
  <line x1="60" y1="60" x2="25" y2="30" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="95" y2="30" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="25" y2="90" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="95" y2="90" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer ring (protocol layer) -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Center hub -->
  <g filter="url(#shadow)">
    <circle cx="60" cy="60" r="22" fill="url(#hubGrad)"/>
    <!-- Inner highlight -->
    <circle cx="54" cy="54" r="8" fill="white" opacity="0.3"/>
    <!-- M letter for MCP -->
    <text x="60" y="67" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">M</text>
  </g>

  <!-- Connection nodes -->
  <!-- Top left - Green (Tool) -->
  <g filter="url(#nodeShadow)">
    <circle cx="25" cy="30" r="12" fill="url(#nodeGrad1)"/>
    <circle cx="22" cy="27" r="4" fill="white" opacity="0.4"/>
  </g>

  <!-- Top right - Blue (Server) -->
  <g filter="url(#nodeShadow)">
    <circle cx="95" cy="30" r="12" fill="url(#nodeGrad2)"/>
    <circle cx="92" cy="27" r="4" fill="white" opacity="0.4"/>
  </g>

  <!-- Bottom left - Pink (Context) -->
  <g filter="url(#nodeShadow)">
    <circle cx="25" cy="90" r="12" fill="url(#nodeGrad3)"/>
    <circle cx="22" cy="87" r="4" fill="white" opacity="0.4"/>
  </g>

  <!-- Bottom right - Green (Resource) -->
  <g filter="url(#nodeShadow)">
    <circle cx="95" cy="90" r="12" fill="url(#nodeGrad1)"/>
    <circle cx="92" cy="87" r="4" fill="white" opacity="0.4"/>
  </g>

  <!-- Small connection dots on lines -->
  <circle cx="42" cy="45" r="3" fill="#DDD6FE"/>
  <circle cx="78" cy="45" r="3" fill="#DDD6FE"/>
  <circle cx="42" cy="75" r="3" fill="#DDD6FE"/>
  <circle cx="78" cy="75" r="3" fill="#DDD6FE"/>
</svg>
