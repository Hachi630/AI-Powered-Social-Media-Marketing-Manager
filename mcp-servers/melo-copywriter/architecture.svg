<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">MCP Copywriter Architecture</text>
  <text x="500" y="65" font-family="Inter, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Gemini API Integration with Built-in Copywriting Rules + RAG Context</text>

  <!-- User/Client Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="140" height="140" rx="16" fill="url(#blueGrad)"/>
    <text x="110" y="250" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">User Request</text>
    <text x="110" y="275" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">"Generate Instagram</text>
    <text x="110" y="290" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">post for spring</text>
    <text x="110" y="305" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">collection"</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 270 L 240 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- MCP Server Box (Main) -->
  <g filter="url(#shadow)">
    <rect x="250" y="100" width="420" height="340" rx="20" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="250" y="100" width="420" height="50" rx="20" fill="url(#greenGrad)"/>
    <rect x="250" y="130" width="420" height="20" fill="url(#greenGrad)"/>
    <text x="460" y="132" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MCP Copywriter Server</text>
  </g>

  <!-- Inner modules - Row 1 -->
  <!-- Platform Rules -->
  <rect x="270" y="165" width="115" height="60" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="327" y="188" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Platform Rules</text>
  <text x="327" y="202" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Instagram • LinkedIn</text>
  <text x="327" y="214" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Twitter • TikTok...</text>

  <!-- Tone Guidelines -->
  <rect x="400" y="165" width="115" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="457" y="188" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#D97706" text-anchor="middle">Tone Guidelines</text>
  <text x="457" y="202" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Professional • Casual</text>
  <text x="457" y="214" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Playful • Warm...</text>

  <!-- Copy Structure -->
  <rect x="530" y="165" width="115" height="60" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="587" y="188" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#6D28D9" text-anchor="middle">Copy Structure</text>
  <text x="587" y="202" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Hook → Body → CTA</text>
  <text x="587" y="214" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Quality Checklist</text>

  <!-- Inner modules - Row 2 -->
  <!-- RAG Module (NEW) -->
  <rect x="270" y="240" width="180" height="75" rx="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
  <text x="360" y="263" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#DB2777" text-anchor="middle">RAG Context Injection</text>
  <text x="360" y="280" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Brand History • Past Campaigns</text>
  <text x="360" y="294" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Style Patterns • Voice Examples</text>
  <text x="360" y="308" font-family="Inter, sans-serif" font-size="8" fill="#BE185D" text-anchor="middle">Vector Search + Retrieval</text>

  <!-- JSON Validation -->
  <rect x="465" y="240" width="180" height="75" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="555" y="263" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Output Validation</text>
  <text x="555" y="280" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">JSON Schema Check</text>
  <text x="555" y="294" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Format Verification</text>
  <text x="555" y="308" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Retry on Failure</text>

  <!-- Prompt Builder -->
  <rect x="305" y="330" width="310" height="55" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="460" y="353" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">System Prompt Builder</text>
  <text x="460" y="370" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Rules + RAG Context → Unified Enhanced Prompt</text>

  <!-- Knowledge Base (External) -->
  <g filter="url(#shadow)">
    <rect x="270" y="450" width="180" height="80" rx="12" fill="url(#cyanGrad)"/>
    <text x="360" y="480" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Brand Knowledge Base</text>
    <text x="360" y="498" font-family="Inter, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Historical Campaigns</text>
    <text x="360" y="512" font-family="Inter, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">Brand Guidelines • Voice</text>
  </g>

  <!-- Arrow from KB to RAG -->
  <path d="M 360 450 L 360 320" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead3)"/>
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06B6D4"/>
    </marker>
  </defs>
  <text x="380" y="420" font-family="Inter, sans-serif" font-size="8" fill="#0891B2" text-anchor="start">Retrieve</text>
  <text x="380" y="432" font-family="Inter, sans-serif" font-size="8" fill="#0891B2" text-anchor="start">Context</text>

  <!-- Arrow 2 -->
  <path d="M 670 270 L 730 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Gemini API Box -->
  <g filter="url(#shadow)">
    <rect x="740" y="200" width="150" height="140" rx="16" fill="url(#purpleGrad)"/>
    <text x="815" y="245" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Gemini API</text>
    <text x="815" y="268" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">gemini-3.0-pro</text>
    <text x="815" y="295" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">With enriched</text>
    <text x="815" y="310" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">context prompt</text>
  </g>

  <!-- Return Arrow -->
  <path d="M 815 340 L 815 400 L 110 400 L 110 340" stroke="#10B981" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Output Box -->
  <rect x="500" y="450" width="380" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="690" y="478" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">{"copy": "...", "hashtags": [...], "hook": "...", "cta": "..."}</text>
  <text x="690" y="498" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Structured JSON Output</text>
  <text x="690" y="515" font-family="Inter, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Brand-consistent • Platform-optimized</text>

  <!-- Labels on arrows -->
  <text x="210" y="260" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Raw</text>
  <text x="210" y="272" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Request</text>

  <text x="700" y="260" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Enhanced</text>
  <text x="700" y="272" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">+ Context</text>

  <text x="900" y="375" font-family="Inter, sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Validated</text>
  <text x="900" y="387" font-family="Inter, sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Response</text>

  <!-- Legend -->
  <rect x="40" y="450" width="200" height="80" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="140" y="470" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Legend</text>
  <rect x="55" y="482" width="12" height="12" rx="2" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.5"/>
  <text x="75" y="492" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">RAG Module</text>
  <rect x="55" y="502" width="12" height="12" rx="2" fill="url(#cyanGrad)"/>
  <text x="75" y="512" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Knowledge Base</text>
</svg>
