<svg width="1600" height="800" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robotCoreDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b39ddb;stop-opacity:1" /> <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" /> </linearGradient>
    
    <linearGradient id="guidePathBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd600;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffd600;stop-opacity:0.8" />
    </linearGradient>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feFlood flood-color="#ffecb3" result="color"/> <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over" />
    </filter>

     <filter id="edgePop">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#e6c200" flood-opacity="0.5"/>
    </filter>
  </defs>

  <path d="M 150,280 Q 400,350 650,150" fill="none" stroke="url(#guidePathBright)" stroke-width="60" stroke-linecap="round" opacity="0.4" />
  <g fill="#ffd600" opacity="0.8">
      <polygon points="380,265 410,280 380,295" transform="rotate(-20 395 280)"/>
      <polygon points="500,215 530,230 500,245" transform="rotate(-35 515 230)"/>
  </g>
  <path d="M 150,280 Q 400,350 650,150" fill="none" stroke="#ffea00" stroke-width="4" stroke-dasharray="15,15" filter="url(#strongGlow)"/>


  <g transform="translate(600, 100) scale(1.3)"> <path d="M 0,80 A 55,60 0 0 1 110,80 Z" fill="#fce4ec" stroke="#b39ddb" stroke-width="2" opacity="0.95" filter="url(#edgePop)"/>
    
    <path d="M 10,80 Q 55,55 100,80 Z" fill="url(#robotCoreDeep)" opacity="0.9" />
    
    <path d="M 0,80 Q 13,95 27,80 T 55,80 T 82,80 T 110,80" fill="none" stroke="#ffd54f" stroke-width="6" stroke-linecap="round" filter="url(#strongGlow)" stroke-linejoin="round"/>
    <path d="M 0,80 Q 13,95 27,80 T 55,80 T 82,80 T 110,80" fill="none" stroke="#ffab00" stroke-width="2" stroke-linecap="round"/> <circle cx="40" cy="68" r="5" fill="#2962ff" />
    <circle cx="70" cy="68" r="5" fill="#2962ff" />
    
    <g filter="url(#strongGlow)">
        <path d="M 30,30 Q 25,5 40,0" fill="none" stroke="#ffd54f" stroke-width="10" stroke-linecap="round" />
        <path d="M 80,30 Q 85,5 70,0" fill="none" stroke="#ffd54f" stroke-width="10" stroke-linecap="round" />
    </g>
    <path d="M 30,30 Q 25,5 40,0" fill="none" stroke="#ffab00" stroke-width="3" stroke-linecap="round" />
    <path d="M 80,30 Q 85,5 70,0" fill="none" stroke="#ffab00" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="55" cy="75" r="2" fill="white" opacity="0.9" />
    <circle cx="25" cy="78" r="1.5" fill="white" opacity="0.9" />
    <circle cx="85" cy="72" r="1.5" fill="white" opacity="0.9" />
  </g>

  <g transform="translate(180, 240) scale(1.3)"> <ellipse cx="-22" cy="38" rx="20" ry="14" fill="#d50000" />
    <ellipse cx="22" cy="38" rx="20" ry="14" fill="#d50000" />
    <circle cx="0" cy="0" r="50" fill="#ffc1e3" stroke="#ec407a" stroke-width="2" />
    <ellipse cx="-14" cy="-6" rx="6" ry="14" fill="#1a237e" />
    <ellipse cx="-14" cy="-12" rx="3" ry="6" fill="white" />
    <ellipse cx="14" cy="-6" rx="6" ry="14" fill="#1a237e" />
    <ellipse cx="14" cy="-12" rx="3" ry="6" fill="white" />
    <ellipse cx="-30" cy="18" rx="9" ry="6" fill="#ff80ab" opacity="0.8" />
    <ellipse cx="30" cy="18" rx="9" ry="6" fill="#ff80ab" opacity="0.8" />
    <path d="M -8,20 Q 0,28 8,20" fill="none" stroke="#880e4f" stroke-width="3" stroke-linecap="round" />
    <circle cx="-48" cy="0" r="13" fill="#ffc1e3" />
    <circle cx="45" cy="-5" r="13" fill="#ffc1e3" transform="rotate(-20 45 -5)"/>
  </g>

  <g fill="#ffd600" filter="url(#strongGlow)">
    <path d="M 400,80 l 5,10 10,2 -8,6 2,10 -10,-5 -10,5 2,-10 -8,-6 10,-2 z" opacity="0.6" />
    <path d="M 600,300 l 3,6 6,1 -4,4 1,6 -6,-3 -6,3 1,-6 -4,-4 6,-1 z" opacity="0.6" />
  </g>
</svg>