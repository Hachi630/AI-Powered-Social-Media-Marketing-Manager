<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Workflow path/road -->
  <path d="M30 260 Q90 235 150 250 Q210 265 270 240 Q330 215 380 230"
        fill="none" stroke="#E8F5E9" stroke-width="45" stroke-linecap="round"/>
  <path d="M30 260 Q90 235 150 250 Q210 265 270 240 Q330 215 380 230"
        fill="none" stroke="#A5D6A7" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round"/>

  <!-- Step markers on the path -->
  <g>
    <!-- Step 1 -->
    <circle cx="55" cy="255" r="18" fill="#4CAF50"/>
    <text x="55" y="261" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>

    <!-- Step 2 -->
    <circle cx="150" cy="250" r="18" fill="#66BB6A"/>
    <text x="150" y="256" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>

    <!-- Step 3 -->
    <circle cx="270" cy="240" r="18" fill="#81C784"/>
    <text x="270" y="246" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>

    <!-- Step 4 - Goal/finish -->
    <circle cx="365" cy="228" r="20" fill="#FFD700"/>
    <text x="365" y="236" text-anchor="middle" font-size="18">⭐</text>
  </g>

  <!-- Floating task icons above path -->
  <g opacity="0.8">
    <!-- Content icon -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="28" height="34" fill="#fff" stroke="#4CAF50" stroke-width="2" rx="3"/>
      <line x1="5" y1="10" x2="23" y2="10" stroke="#4CAF50" stroke-width="2"/>
      <line x1="5" y1="17" x2="20" y2="17" stroke="#4CAF50" stroke-width="2"/>
      <line x1="5" y1="24" x2="16" y2="24" stroke="#4CAF50" stroke-width="2"/>
    </g>

    <!-- Calendar icon -->
    <g transform="translate(135, 185)">
      <rect x="0" y="5" width="28" height="26" fill="#fff" stroke="#66BB6A" stroke-width="2" rx="3"/>
      <rect x="0" y="5" width="28" height="8" fill="#66BB6A" rx="3 3 0 0"/>
      <circle cx="8" cy="23" r="3" fill="#66BB6A"/>
      <circle cx="20" cy="23" r="3" fill="#66BB6A"/>
    </g>

    <!-- Analytics icon -->
    <g transform="translate(255, 175)">
      <rect x="0" y="0" width="30" height="30" fill="#fff" stroke="#81C784" stroke-width="2" rx="3"/>
      <rect x="5" y="18" width="5" height="8" fill="#81C784"/>
      <rect x="12" y="12" width="5" height="14" fill="#81C784"/>
      <rect x="19" y="6" width="5" height="20" fill="#81C784"/>
    </g>
  </g>

  <!-- Checkmarks -->
  <g stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M75 275 L82 282 L95 265" stroke="#4CAF50"/>
    <path d="M170 270 L177 277 L190 260" stroke="#66BB6A"/>
  </g>

  <!-- Arrow showing flow direction -->
  <g transform="translate(320, 255)">
    <path d="M0 0 L35 0 L28 -8 M35 0 L28 8" stroke="#A5D6A7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars around Kirby -->
  <g fill="#FFD54F">
    <!-- Top star -->
    <polygon points="200,15 206,32 224,32 210,43 215,60 200,50 185,60 190,43 176,32 194,32"/>
    <!-- Top left star -->
    <polygon points="85,45 89,58 103,58 92,67 96,80 85,71 74,80 78,67 67,58 81,58"/>
    <!-- Top right star -->
    <polygon points="315,35 319,48 333,48 322,57 326,70 315,61 304,70 308,57 297,48 311,48"/>
    <!-- Bottom left star -->
    <polygon points="45,145 48,155 59,155 51,162 54,172 45,165 36,172 39,162 31,155 42,155"/>
    <!-- Bottom right star -->
    <polygon points="355,125 358,135 369,135 361,142 364,152 355,145 346,152 349,142 341,135 352,135"/>
  </g>

  <!-- Kirby left arm raised up waving -->
  <ellipse cx="120" cy="95" rx="26" ry="20" fill="#FFB6C1" transform="rotate(-35 120 95)"/>

  <!-- Main Kirby body with soft shading -->
  <defs>
    <radialGradient id="kirbyBodyGradient2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFC8D4"/>
      <stop offset="100%" stop-color="#FFB6C1"/>
    </radialGradient>
    <radialGradient id="kirbyFeetGradient2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="120" rx="75" ry="68" fill="url(#kirbyBodyGradient2)"/>

  <!-- Kirby right arm -->
  <ellipse cx="280" cy="110" rx="24" ry="18" fill="#FFB6C1" transform="rotate(20 280 110)"/>

  <!-- Kirby feet -->
  <ellipse cx="160" cy="182" rx="30" ry="18" fill="url(#kirbyFeetGradient2)"/>
  <ellipse cx="240" cy="182" rx="30" ry="18" fill="url(#kirbyFeetGradient2)"/>

  <!-- Kirby blush circles -->
  <ellipse cx="150" cy="125" rx="14" ry="9" fill="#FF9999" opacity="0.7"/>
  <ellipse cx="250" cy="125" rx="14" ry="9" fill="#FF9999" opacity="0.7"/>

  <!-- Eyes - blue glossy oval eyes with white highlights -->
  <ellipse cx="175" cy="105" rx="14" ry="20" fill="#2E7DD1"/>
  <ellipse cx="225" cy="105" rx="14" ry="20" fill="#2E7DD1"/>

  <!-- Eye highlights - white ovals -->
  <ellipse cx="170" cy="98" rx="5" ry="8" fill="#fff"/>
  <ellipse cx="220" cy="98" rx="5" ry="8" fill="#fff"/>

  <!-- Happy open mouth -->
  <ellipse cx="200" cy="140" rx="12" ry="10" fill="#333"/>
  <ellipse cx="200" cy="143" rx="8" ry="5" fill="#FF6B8A"/>
</svg>